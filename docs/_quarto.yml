    center: |
      [GitHub](https://github.com/bendlikeabamboo/mayon) &middot; [Releases](https://github.com/bendlikeabamboo/mayon/releases)

format:
  html:
    theme: cosmo
    toc: true
    toc-location: right
    smooth-scroll: true
