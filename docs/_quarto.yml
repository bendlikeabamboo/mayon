project:
  type: website
  output-dir: ../build/docs

website:
  title: 'Mayon Docs'
  favicon: favicon.png
  site-url: https://bendlikeabamboo.github.io/mayon
  repo-url: https://github.com/bendlikeabamboo/mayon
  bread-crumbs: true
  page-navigation: true
  repo-actions: [issue, source]
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: tutorials/getting-started.qmd
        text: Tutorials
      - href: how-to/providers.qmd
        text: How-to guides
      - href: reference/seams.qmd
        text: Reference
      - href: explanation/architecture.qmd
        text: Explanation
      - href: dev-notes/index.qmd
        text: Dev notes
      - href: history/index.qmd
        text: Decision history
    right:
      - icon: github
        href: https://github.com/bendlikeabamboo/mayon
  sidebar:
    style: floating
    search: true
    collapse-level: 2
    contents:
      - section: 'Tutorials'
        contents:
          - tutorials/getting-started.qmd
          - tutorials/chat-and-branching.qmd
      - section: 'How-to guides'
        contents:
          - how-to/providers.qmd
          - how-to/data-and-privacy.qmd
          - how-to/labs.qmd
          - how-to/quizzes.qmd
          - how-to/building.qmd
          - how-to/contributing.qmd
      - section: 'Reference'
        contents:
          - reference/seams.qmd
      - section: 'Explanation'
        contents:
          - explanation/architecture.qmd
      - section: 'Development notes'
        contents:
          - dev-notes/index.qmd
          - dev-notes/foundation-phases.qmd
          - dev-notes/postgres-migration.qmd
      - section: 'Decision history'
        contents:
          - history/index.qmd
          - section: 'Arc A — The agent surface takes shape'
            contents:
              - history/001-brave-search-mcp.qmd
              - history/002-chat-timeline-kinds.qmd
              - history/003-timeline-ux-fixes.qmd
              - history/004-internal-area-unification.qmd
          - section: 'Arc B — The AI plumbing industrializes'
            contents:
              - history/005-shape-driven-results.qmd
              - history/006-ai-elements-adoption.qmd
              - history/007-inference-provider-templates.qmd
              - history/008-inference-router-templates.qmd
              - history/009-provider-request-settings.qmd
              - history/010-custom-expound-instructions.qmd
