              - history/017-secure-public-launch.qmd
              - history/017-mock-llm-chat-tests.qmd
              - history/019-security-posture-detection.qmd
              - history/020-rc-ui-verification.qmd
          - section: 'Arc E — Surface, reach & the docs themselves'
            contents:
              - history/014-settings-navigation.qmd
              - history/015-floating-reply-outline.qmd
              - history/016-github-copilot-support.qmd
              - history/017-section-peek-strip.qmd
