name: CI
description: Install deps, lint, type-check, run tiered tests and budgets, build SPA, and verify Docker builds
runs:
  using: composite
  steps:
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm svelte-kit sync
    - shell: bash
      run: pnpm --filter @mayon/shared build
    - shell: bash
      run: pnpm lint
    - shell: bash
      run: pnpm check:boundaries
    - shell: bash
      run: pnpm check:tests
    - shell: bash
      run: pnpm check
    - shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - shell: bash
      run: pnpm test:ci
    - name: Upload tier duration report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: tier-durations
        path: test-results/tier-durations.json
        retention-days: 7
        if-no-files-found: ignore
    - shell: bash
      run: pnpm build
    - shell: bash
      run: docker build .
    - shell: bash
      run: docker build -f server/Dockerfile .
