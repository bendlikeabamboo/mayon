name: CI
description: Install deps, lint, type-check, run tiered tests and budgets, build SPA, and verify Docker builds
runs:
  using: composite
  steps:
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm svelte-kit sync
    - shell: bash
      run: pnpm --filter @mayon/shared build
    - shell: bash
      run: pnpm lint
    - shell: bash
      run: pnpm check:boundaries
    - shell: bash
      run: pnpm check:tests
    - shell: bash
      run: pnpm check
    - shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - shell: bash
      run: pnpm test:ci
    - name: Upload tier duration report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: tier-durations
        path: test-results/tier-durations.json
        retention-days: 7
        if-no-files-found: ignore
    - shell: bash
      run: pnpm build
    # Production Docker image builds are a release-path smoke test, not a PR
    # gate. PRs spend ~5 minutes building both images even with the GHA cache;
    # pushes to main/tags still verify them. (The e2e job's dev images are built
    # separately by build-e2e-images and shared through GHCR.)
    - if: github.event_name != 'pull_request'
      shell: bash
      # Same type=gha cache backend as the e2e shard pre-builds; keys are
      # content-derived per Dockerfile, so these prod builds cache
      # independently of the dev-image cache.
      run: docker buildx build --cache-from type=gha --cache-to type=gha,mode=max .
    - if: github.event_name != 'pull_request'
      shell: bash
      run: docker buildx build --cache-from type=gha --cache-to type=gha,mode=max -f server/Dockerfile .
