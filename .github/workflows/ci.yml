name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - uses: ./.github/actions/ci

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Audit dependencies (report-only)
        shell: bash
        run: |
          ws="$PWD"
          mkdir -p audit-reports
          {
            echo "## Dependency audit (report-only)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in . server packages/shared; do
            name="${dir//\//-}"
            report="$ws/audit-reports/${name}.json"
            if (cd "$dir" && pnpm audit --json > "$report" 2>/dev/null); then
              result="clean — no known vulnerabilities found"
            elif [ -s "$report" ]; then
              result=":warning: FINDINGS — known vulnerabilities reported; details in the JSON artifact"
            else
              result=":x: AUDIT FAILED — no report produced; this root was NOT assessed"
            fi
            {
              echo "### \`$dir\`"
              echo ""
              echo "$result"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-reports
          path: audit-reports/*.json
          retention-days: 30
          if-no-files-found: ignore

  # Build the two dev images once per commit and share them with the e2e job
  # through GHCR. One leg per image so the builds run in parallel; per-image
  # cache scopes keep a web cache miss from invalidating the server index.
  # Fork PRs skip this (and e2e): they cannot push packages, and e2e is not a
  # fork gate — the web job still runs for them.
  build-e2e-images:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mayon-dev-web
            dockerfile: Dockerfile.dev
            scope: e2e-dev-web
          - image: mayon-dev-server
            dockerfile: server/Dockerfile.dev
            scope: e2e-dev-server
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:sha-${GITHUB_SHA}"
          docker buildx build --push \
            --cache-from type=gha,scope=${{ matrix.scope }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.scope }} \
            -t "$image" \
            -f ${{ matrix.dockerfile }} .
      - name: Record pushed image
        shell: bash
        run: echo "Pushed ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  # One runner, one dev stack, parallel Playwright workers. The stack image tags
  # below match the compose-generated names for project mayon-dev-shard-1
  # (`<project>-<service>`), so scripts/dev-shard.mjs's plain `up -d` adopts the
  # prebuilt images instead of building them. Spec files are independent except
  # provider-picker-coaching, which owns an isolated provider and runs serial.
  e2e:
    needs: build-e2e-images
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mayon/shared build
      - run: pnpm exec playwright install --with-deps chromium
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull prebuilt dev images into the shard stack tags
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in mayon-dev-web mayon-dev-server; do
            docker pull "ghcr.io/${owner}/${image}:sha-${GITHUB_SHA}"
          done
          docker tag "ghcr.io/${owner}/mayon-dev-web:sha-${GITHUB_SHA}" mayon-dev-shard-1-web
          docker tag "ghcr.io/${owner}/mayon-dev-server:sha-${GITHUB_SHA}" mayon-dev-shard-1-server
      - run: pnpm dev:shard:up 1/1
      # The budget checker reads every tier3-shard-*.json in the directory; drop
      # any stale report so a reused workspace cannot satisfy the tier3 gate
      # with an old number.
      - name: Remove stale shard reports
        shell: bash
        run: rm -f test-results/tier3-shard-*.json
      - name: Run e2e suite and check its budget
        env:
          E2E_BASE_URL: http://127.0.0.1:5201
          MAYON_E2E_WORKERS: 4
        run: pnpm test:e2e:ci --shard=1/1
      - if: always()
        run: pnpm dev:shard:down 1
      - name: Upload tier 3 report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier3-shard-1
          path: test-results/tier3-shard-*.json
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
