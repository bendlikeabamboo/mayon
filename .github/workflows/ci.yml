name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - uses: ./.github/actions/ci

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Audit dependencies (report-only)
        shell: bash
        run: |
          ws="$PWD"
          mkdir -p audit-reports
          {
            echo "## Dependency audit (report-only)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in . server packages/shared; do
            name="${dir//\//-}"
            report="$ws/audit-reports/${name}.json"
            if (cd "$dir" && pnpm audit --json > "$report" 2>/dev/null); then
              result="clean — no known vulnerabilities found"
            elif [ -s "$report" ]; then
              result=":warning: FINDINGS — known vulnerabilities reported; details in the JSON artifact"
            else
              result=":x: AUDIT FAILED — no report produced; this root was NOT assessed"
            fi
            {
              echo "### \`$dir\`"
              echo ""
              echo "$result"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-reports
          path: audit-reports/*.json
          retention-days: 30
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mayon/shared build
      - run: pnpm exec playwright install --with-deps chromium
      # Pre-build the shard stack's images through Buildx so the GitHub Actions
      # layer cache serves them across runs. Compose names project images
      # `<project>-<service>`, so the tags below are exactly what project
      # mayon-dev-shard-N's `web`/`server` resolve to — and
      # scripts/dev-shard.mjs runs plain `up -d` (no --build), which adopts
      # pre-loaded images instead of building them cold. Both shard legs share
      # one dev-image cache (keys are content-derived per Dockerfile, so these
      # never collide with the prod builds in the web job / release pipeline).
      - uses: docker/setup-buildx-action@v3
      - name: Pre-build shard web image (cache-backed, compose-named tag)
        run: docker buildx build --cache-from type=gha --cache-to type=gha,mode=max --load -t mayon-dev-shard-${{ matrix.shard }}-web -f Dockerfile.dev .
      - name: Pre-build shard server image (cache-backed, compose-named tag)
        run: docker buildx build --cache-from type=gha --cache-to type=gha,mode=max --load -t mayon-dev-shard-${{ matrix.shard }}-server -f server/Dockerfile.dev .
      # One dev stack per shard (project mayon-dev-shard-N, web :5200+N) so
      # shards run with zero shared-state races; the runner resolves which
      # shard publishes the host-side langfuse-stub port (9998).
      - run: pnpm dev:shard:up ${{ matrix.shard }}/2
      - run: pnpm dev:shard:test ${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
