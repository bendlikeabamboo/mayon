name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - uses: ./.github/actions/ci

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Audit dependencies (report-only)
        shell: bash
        run: |
          ws="$PWD"
          mkdir -p audit-reports
          {
            echo "## Dependency audit (report-only)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in . server packages/shared; do
            name="${dir//\//-}"
            report="$ws/audit-reports/${name}.json"
            if (cd "$dir" && pnpm audit --json > "$report" 2>/dev/null); then
              result="clean — no known vulnerabilities found"
            elif [ -s "$report" ]; then
              result=":warning: FINDINGS — known vulnerabilities reported; details in the JSON artifact"
            else
              result=":x: AUDIT FAILED — no report produced; this root was NOT assessed"
            fi
            {
              echo "### \`$dir\`"
              echo ""
              echo "$result"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-reports
          path: audit-reports/*.json
          retention-days: 30
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mayon/shared build
      - run: pnpm exec playwright install --with-deps chromium
      # Pre-build the shard stack's images through Buildx so the GitHub Actions
      # layer cache serves them across runs. Compose names project images
      # `<project>-<service>`, so the tags below are exactly what project
      # mayon-dev-shard-N's `web`/`server` resolve to — and
      # scripts/dev-shard.mjs runs plain `up -d` (no --build), which adopts
      # pre-loaded images instead of building them cold. Both shard legs share
      # one dev-image cache (keys are content-derived per Dockerfile, so these
      # never collide with the prod builds in the web job / release pipeline).
      - uses: docker/setup-buildx-action@v3
      - name: Pre-build shard web image (cache-backed, compose-named tag)
        run: docker buildx build --cache-from type=gha --cache-to type=gha,mode=max --load -t mayon-dev-shard-${{ matrix.shard }}-web -f Dockerfile.dev .
      - name: Pre-build shard server image (cache-backed, compose-named tag)
        run: docker buildx build --cache-from type=gha --cache-to type=gha,mode=max --load -t mayon-dev-shard-${{ matrix.shard }}-server -f server/Dockerfile.dev .
      # Resolve the capability gate once per runner and pass the decision to
      # every shard process. Spec files are independent (no shared ports, chat
      # ids, or provider ids), so four runners can run four shards safely.
      - name: Resolve test capability gate
        shell: bash
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { readCapacity, formatCapacityReport } from "./scripts/test-capacity.mjs";
            const capacity = readCapacity();
            console.log(formatCapacityReport(capacity));
            appendFileSync(process.env.GITHUB_ENV, `MAYON_TEST_MAX_WORKERS=${capacity.workers}\n`);
          '
      # One dev stack per shard (project mayon-dev-shard-N, web :5200+N) so
      # shards run with zero shared-state races.
      - run: pnpm dev:shard:up ${{ matrix.shard }}/4
      - name: Run e2e shard and check its budget
        env:
          E2E_BASE_URL: http://127.0.0.1:520${{ matrix.shard }}
        run: pnpm test:e2e:ci --shard=${{ matrix.shard }}/4
      - if: always()
        run: pnpm dev:shard:down ${{ matrix.shard }}
      - name: Upload tier 3 shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tier3-shard-${{ matrix.shard }}
          path: test-results/tier3-shard-*.json
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
