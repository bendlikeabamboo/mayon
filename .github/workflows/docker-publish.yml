name: Docker Publish

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: ./.github/actions/ci

  classify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.c.outputs.version }}
      base_version: ${{ steps.c.outputs.base_version }}
      is_rc: ${{ steps.c.outputs.is_rc }}
    steps:
      - id: c
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME#v}"
          base="${ref%%-rc*}"
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$ref"       >> "$GITHUB_OUTPUT"
          echo "base_version=$base" >> "$GITHUB_OUTPUT"

  verify-version:
    needs: [classify]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.classify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release contract
        shell: bash
        env:
          VERSION: ${{ needs.classify.outputs.version }}
          BASE: ${{ needs.classify.outputs.base_version }}
          IS_RC: ${{ needs.classify.outputs.is_rc }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Tag '$VERSION' is not 'X.Y.Z' or 'X.Y.Z-rcN'"
            exit 1
          fi
          for f in package.json server/package.json packages/shared/package.json; do
            v=$(jq -r .version "$f")
            if [ "$v" != "$BASE" ]; then
              echo "::error::$f version '$v' != base '$BASE'"
              exit 1
            fi
          done
          if ! grep -Eq "^## \[${BASE//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${BASE}]' section"
            exit 1
          fi
          echo "Release contract satisfied for v${VERSION} (base ${BASE}, rc=${IS_RC})."

  build-and-push:
    needs: [ci, classify, verify-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      matrix:
        include:
          - dockerfile: ./Dockerfile
            image: ghcr.io/bendlikeabamboo/mayon
            short: mayon
          - dockerfile: server/Dockerfile
            image: ghcr.io/bendlikeabamboo/mayon-server
            short: mayon-server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ needs.classify.outputs.is_rc == 'false' }}
            type=raw,value=rc,enable=${{ needs.classify.outputs.is_rc == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities (report-only)
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}:${{ needs.classify.outputs.version }}
          format: json
          output: trivy-report.json
          exit-code: '0'
          scanners: vuln,secret
      - name: Generate SARIF for code scanning
        id: sarif
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}:${{ needs.classify.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          scanners: vuln
      - name: Upload SARIF to code scanning
        if: steps.sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: security-scan/${{ matrix.short }}
      - name: Upload scan report artifact
        if: steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.short }}
          path: trivy-report.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Record scan outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Image security scan (report-only) — ${{ matrix.short }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo ":x: SCAN FAILED — this release leg was not assessed (gap)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-report.json)
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-report.json)
          medium=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-report.json)
          secrets=$(jq '[.Results[]?.Secrets[]?] | length' trivy-report.json)
          {
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| CRITICAL | $critical |"
            echo "| HIGH | $high |"
            echo "| MEDIUM | $medium |"
            echo "| Embedded secrets | $secrets |"
            echo ""
            echo "Report-only: findings never block this release. Full details: code scanning (SARIF) and the \`trivy-${{ matrix.short }}\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  release-assets:
    needs: [ci, classify, verify-version, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bake release version into install.sh
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          mkdir -p out
          sed "s/@MAYON_INSTALLER_VERSION@/${VERSION}/" install.sh > out/install.sh
          chmod +x out/install.sh
          grep -q "MAYON_INSTALLER_VERSION=\"${VERSION}\"" out/install.sh
          cp docker-compose.yml out/docker-compose.yml
          cp docker-compose.override.yml.floor out/docker-compose.override.yml.floor
          cp Caddyfile.floor out/Caddyfile.floor
          grep -q 'ports: !override \[\]' out/docker-compose.override.yml.floor
          grep -q 'MAYON_BASIC_AUTH_HASH' out/docker-compose.override.yml.floor
          grep -q 'basic_auth' out/Caddyfile.floor
          grep -q 'flush_interval -1' out/Caddyfile.floor
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.classify.outputs.is_rc == 'true' && format('Mayon {0} (Release Candidate)', needs.verify-version.outputs.version) || format('Mayon {0}', needs.verify-version.outputs.version) }}
          prerelease: ${{ needs.classify.outputs.is_rc == 'true' }}
          make_latest: ${{ needs.classify.outputs.is_rc == 'false' }}
          files: |
            out/install.sh
            out/docker-compose.yml
            out/docker-compose.override.yml.floor
            out/Caddyfile.floor
          generate_release_notes: true
          fail_on_unmatched_files: true
